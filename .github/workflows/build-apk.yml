name: Build CutStudio APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CutStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CutStudio-APK
          path: CutStudio.apk

      - name: Publish as a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CutStudio build ${{ github.run_number }}
          body: Install CutStudio.apk on your Android phone (Android 8.0 or newer).
          files: CutStudio.apk
          make_latest: true
