plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cutstudio.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.cutstudio.app"
        minSdk 26          // Android 8.0+
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs straight away.
            // For the Play Store, create your own keystore (Build > Generate Signed Bundle / APK).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
